<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Helvetica Neue",Arial,sans-serif;background:#0E1116}

#cover{width:1640px;height:624px;position:relative;overflow:hidden;color:#fff;
  display:flex;align-items:center;padding:0 90px;background:#0E1116}

/* foto real de fondo */
#cover .photo{position:absolute;inset:0;background:url('bg-cabeza.jpeg') center 42%/cover no-repeat;
  filter:saturate(.85) contrast(1.05)}
/* oscurecido: fuerte a la izquierda pa que el texto se lea, mas abierto a la derecha */
#cover .veil{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(10,13,17,.94) 0%,rgba(10,13,17,.90) 38%,rgba(10,13,17,.62) 62%,rgba(10,13,17,.80) 100%)}
#cover .glow{position:absolute;right:-140px;top:-120px;width:560px;height:560px;
  background:radial-gradient(circle,rgba(226,59,46,.28),transparent 62%)}

#cover .checker{position:absolute;top:0;left:0;right:0;height:20px;z-index:3;
  background:repeating-conic-gradient(#12161C 0% 25%, transparent 0% 50%) 0 0/40px 40px,#F5A623}
#cover .checker.b{top:auto;bottom:0}

#cover .left{position:relative;z-index:2}
#cover .tag{color:#F5A623;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:22px;margin-bottom:14px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#cover h1{font-family:"Arial Black",Impact,sans-serif;font-size:92px;line-height:.95;
  text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.95)}
#cover h1 em{color:#E23B2E;font-style:normal}
#cover .kata{margin-top:16px;color:#8b93a0;letter-spacing:.32em;font-size:19px;font-weight:700}

#cover .right{margin-left:auto;text-align:center;position:relative;z-index:2;
  background:rgba(14,17,22,.82);backdrop-filter:blur(3px);
  border:2px solid #3d4b5c;border-radius:24px;padding:38px 46px;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
#cover .wlbl{color:#9aa4b1;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:19px}
#cover .wa{font-family:"Arial Black",Impact,sans-serif;font-size:46px;color:#25D366}
#cover .r2{color:#c7cdd6;font-size:22px;margin-top:8px}
#cover .r3{color:#F5A623;font-weight:700;font-size:22px;margin-top:6px}
</style>
</head>
<body>
<div id="cover">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="glow"></div>
  <div class="checker"></div>
  <div class="left">
    <div class="tag">Mecánico a Domicilio · Bayamón, PR</div>
    <h1>El taller<br><em>llega a ti.</em></h1>
    <div class="kata">ピットストップ</div>
  </div>
  <div class="right">
    <div class="wlbl">WhatsApp</div>
    <div class="wa">787-454-6513</div>
    <div class="r2">Lun–Sáb · 8am–6pm</div>
    <div class="r3">Diagnóstico desde $60 — se acredita</div>
  </div>
  <div class="checker b"></div>
</div>
</body>
</html>
